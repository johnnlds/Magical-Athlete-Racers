<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Magical Athlete Character Profiles</title>

  <meta
    name="description"
    content="Magical Athlete racer character profiles, abilities, and interactions."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <h1>MAGICAL ATHLETE</h1>

      <p>Character Profiles</p>

      <div class="search-container">
        <input
          type="search"
          id="searchInput"
          placeholder="Search characters..."
          autocomplete="off"
          aria-label="Search characters"
        >
      </div>

    </div>
  </header>


  <main>

    <section class="characters-section">

      <div class="section-header">

        <h2>Racers</h2>

        <span id="characterCount"></span>

      </div>


      <div
        id="characterGrid"
        class="character-grid"
      ></div>


      <div
        id="noResults"
        class="no-results hidden"
      >
        No characters found.
      </div>

    </section>

  </main>


  <!-- CHARACTER PROFILE MODAL -->

  <div
    id="profileModal"
    class="modal"
    aria-hidden="true"
  >

    <div
      id="modalOverlay"
      class="modal-overlay"
    ></div>


    <div
      class="profile-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="profileName"
    >

      <button
        id="closeModal"
        class="close-button"
        type="button"
        aria-label="Close character profile"
      >
        ×
      </button>


      <div class="profile-layout">


        <!-- LEFT SIDE: CHARACTER -->

        <aside class="profile-sidebar">

          <div class="profile-image-container">

            <img
              id="profileImage"
              class="profile-image"
              src=""
              alt=""
            >

          </div>


          <h2 id="profileName"></h2>


          <div class="ability-box">

            <div class="ability-label">
              ABILITY
            </div>


            <div
              id="profileAbilityName"
              class="ability-name"
            ></div>


            <div
              id="profileAbilityText"
              class="ability-text"
            ></div>

          </div>

        </aside>


        <!-- RIGHT SIDE: INTERACTIONS -->

        <section class="profile-interactions">

          <div class="interactions-header">

            <h3>Interactions</h3>

            <p id="interactionCount"></p>

          </div>


          <div
            id="interactionList"
          ></div>


          <div
            id="noInteractions"
            class="no-interactions hidden"
          >
            No notable interactions listed.
          </div>

        </section>

      </div>

    </div>

  </div>


  <!-- IMPORTANT: LOAD JAVASCRIPT AFTER THE PAGE CONTENT -->

  <script src="./script.js"></script>

</body>
</html>
