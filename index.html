<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Magical Athlete Racers - Character abilities and interaction database">
    <title>Magical Athlete Racers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="site-header">
        <div class="header-content">
            <div>
                <p class="eyebrow">MAGICAL ATHLETE</p>
                <h1>Racers &amp; Interactions</h1>
                <p class="subtitle">
                    A comprehensive character reference and interaction database.
                </p>
            </div>
        </div>
    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="container">

        <!-- Search -->
        <section class="search-section">
            <label for="search" class="sr-only">Search athletes</label>

            <input
                type="search"
                id="search"
                placeholder="Search characters, abilities, or interactions..."
                autocomplete="off"
            >

            <div class="search-info">
                <span id="result-count">36 racers</span>
            </div>
        </section>


        <!-- Filters -->
        <section class="filter-section">
            <button class="filter active" data-filter="all">
                All
            </button>

            <button class="filter" data-filter="movement">
                Movement
            </button>

            <button class="filter" data-filter="dice">
                Dice
            </button>

            <button class="filter" data-filter="position">
                Position
            </button>

            <button class="filter" data-filter="special">
                Special
            </button>
        </section>


        <!-- Athlete Cards -->
        <section
            id="athlete-grid"
            class="athlete-grid"
            aria-live="polite"
        ></section>

    </main>


    <!-- =========================
         MODAL
    ========================== -->
    <div
        id="modal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-backdrop"></div>

        <div
            class="modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
        >

            <button
                id="modal-close"
                class="modal-close"
                type="button"
                aria-label="Close"
            >
                &times;
            </button>

            <div id="modal-content"></div>

        </div>
    </div>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="site-footer">
        <p>
            Magical Athlete Racers Reference
        </p>

        <p class="footer-small">
            Character interactions are categorized by source/status.
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
