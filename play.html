
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magical Athlete — Play</title>
  <link rel="stylesheet" href="./play.css?v=7">
  <script src="./play.js?v=7" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="./index.html">← Racer Reference</a>
    <h1>Magical Athlete</h1>
  </header>

  <main class="app">
    <section class="panel setup-panel">
      <h2>Set up your race</h2>

      <label for="playerCount">Number of racers</label>
      <select id="playerCount">
        <option value="2">2 racers</option>
        <option value="3">3 racers</option>
        <option value="4">4 racers</option>
        <option value="5">5 racers</option>
        <option value="6">6 racers</option>
        <option value="7">7 racers</option>
        <option value="8">8 racers</option>
      </select>

      <div id="racerChoices" class="racer-choices"></div>

      <button id="startRace" class="primary">Start race</button>
      <p id="setupMessage" class="message" aria-live="polite"></p>
    </section>

    <section class="panel game-panel">
      <div class="die-controls">
        <div id="dieFace" class="die-face" aria-live="polite">—</div>

        <div class="die-actions">
          <div class="game-buttons">
            <button id="rollDie" class="primary" disabled>Roll die</button>
            <button id="tripPiece" class="secondary" disabled>Trip</button>
            <button id="undoTrip" class="secondary small-button" disabled>Undo Trip</button>
            <button id="newRace" class="secondary">New race</button>
          </div>
          <p id="turnMessage" class="message" aria-live="polite" hidden></p>
        </div>
      </div>

      <div class="board-scroll">
        <div id="board" class="board" aria-label="Mild Mile race board">
          <div class="board-placeholder">
            Start a race to see the board.
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Turn order</h2>
      <p class="muted">Drag the handle to reorder racers. Use + and − to change scores.</p>
      <div id="standings" class="standings">
        Start a race to see your racers.
      </div>
    </section>

    <section class="panel">
      <h2>Selected racer</h2>
      <div id="racerDetails" class="racer-details">
        Select a racer to see their details.
      </div>
    </section>

    <section class="panel">
      <h2>Move history</h2>
      <ol id="history" class="history">
        <li>No moves yet.</li>
      </ol>
      <button id="undoMove" class="secondary" disabled>Undo last action</button>
    </section>
  </main>
</body>
</html>
